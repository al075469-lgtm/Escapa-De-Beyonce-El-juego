<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="app.css">
    <title>Escapa de Beyoncé</title>
</head>
<body>

    <h1>Escapa de Beyoncé</h1>
    <div id="game-area">
        <div id="player" class="character"></div>
        <div id="beyonce" class="character"></div>
    </div>

    <!-- Panel de configuración -->
    <div id="config-panel">
        <h2>Configuración</h2>

        <label for="player-speed">Velocidad del jugador: <span id="player-speed-value">40</span></label>
        <input type="range" id="player-speed" min="10" max="100" step="10" value="40">

        <label for="enemy-speed">Velocidad de Beyoncé: <span id="enemy-speed-value">1</span></label>
        <input type="range" id="enemy-speed" min="0.5" max="5" step="0.5" value="1">

        <label for="bg-color">Color de fondo</label>
        <input type="color" id="bg-color" value="#f0f0f0">

        <label for="player-color">Color del jugador</label>
        <input type="color" id="player-color" value="#0000ff">
    </div>

    <script type="text/javascript" src="app.js"></script>

</body>
</html>
